<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EFFECTIVE COMMUNICATION - Group 2</title>
  <meta name="description" content="3D interactive neon blue and black globe visualization with floating topic crystals for Effective Communication - Group 2." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020408;
      color: #d8f5ff;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background: radial-gradient(circle at center, transparent 38%, rgba(2, 6, 14, 0.65) 75%, rgba(1, 4, 10, 0.94) 100%);
    }
    .scanlines-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      opacity: 0.25;
      background-image: linear-gradient(rgba(0, 229, 255, 0.03) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
    }
    .header-container {
      position: fixed;
      top: 20px;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      padding: 0 16px;
    }
    .header-badge {
      position: relative;
      pointer-events: auto;
      background-color: rgba(3, 13, 29, 0.85);
      border: 1px solid rgba(0, 245, 255, 0.4);
      border-radius: 4px;
      padding: 12px 24px;
      box-shadow: 0 0 30px rgba(0, 245, 255, 0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .corner-tl {
      position: absolute;
      top: -1px;
      left: -1px;
      width: 10px;
      height: 10px;
      border-top: 2px solid #00f5ff;
      border-left: 2px solid #00f5ff;
    }
    .corner-br {
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 10px;
      height: 10px;
      border-bottom: 2px solid #00f5ff;
      border-right: 2px solid #00f5ff;
    }
    .header-title {
      font-family: 'Orbitron', monospace, sans-serif;
      text-align: center;
      font-size: clamp(14px, 2.5vw, 24px);
      font-weight: 900;
      letter-spacing: 0.25em;
      color: #00f5ff;
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(0, 245, 255, 0.7);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="webgl-container"></div>
  <div class="vignette-overlay"></div>
  <div class="scanlines-overlay"></div>

  <header class="header-container">
    <div class="header-badge">
      <div class="corner-tl"></div>
      <div class="corner-br"></div>
      <h1 class="header-title">EFFECTIVE COMMUNICATION - Group 2</h1>
    </div>
  </header>

  <script type="module">
    import * as THREE from 'three';

    const TOPICS = [
      { name: 'PODCAST' },
      { name: 'MOBILE JOURNALISM' },
      { name: 'PHOTO JOURNALISM' },
      { name: 'INFOGRAPHICS' },
      { name: 'STATISTICS AND GRAPHS' },
      { name: 'BLOG' },
      { name: 'COMMENT SECTION' },
      { name: 'COMMENTARY' },
      { name: 'SLOGAN' },
      { name: 'DIGITAL AND MANUALLY\nDRAWN TOPIC' }
    ];

    const CONTINENT_POLYGONS = [
      [[71,-156],[69,-141],[70,-128],[60,-94],[58,-80],[62,-75],[52,-56],[47,-53],[44,-64],[41,-70],[35,-75],[29,-81],[25,-80],[29,-89],[26,-97],[20,-87],[16,-88],[9,-79],[8,-82],[14,-92],[18,-105],[23,-109],[32,-117],[37,-122],[48,-125],[54,-133],[60,-149],[65,-168],[71,-156]],
      [[83,-30],[81,-18],[76,-20],[70,-26],[60,-44],[65,-53],[75,-58],[78,-72],[82,-60],[83,-30]],
      [[12,-72],[10,-62],[6,-53],[-1,-48],[-5,-35],[-12,-37],[-23,-42],[-33,-51],[-40,-62],[-54,-67],[-55,-71],[-46,-75],[-33,-72],[-18,-71],[-5,-81],[2,-77],[9,-76],[12,-72]],
      [[71,28],[69,16],[62,5],[58,8],[54,9],[53,5],[51,2],[48,-4],[43,-9],[36,-6],[37,-1],[43,3],[44,8],[38,15],[37,24],[40,27],[45,35],[56,38],[64,40],[68,50],[70,38],[71,28]],
      [[58,-5],[55,-1],[51,1],[50,-5],[54,-3],[58,-5]],
      [[37,10],[36,1],[35,-5],[30,-10],[21,-17],[15,-17],[11,-15],[5,-1],[4,9],[-1,9],[-5,12],[-12,13],[-23,14],[-34,18],[-34,26],[-28,32],[-16,40],[-11,41],[4,48],[11,51],[12,44],[22,37],[31,32],[32,25],[37,10]],
      [[-12,49],[-16,50],[-25,47],[-25,44],[-16,44],[-12,49]],
      [[77,104],[73,80],[70,60],[67,45],[55,38],[42,48],[37,36],[30,34],[22,38],[15,42],[13,51],[24,57],[25,62],[23,70],[15,74],[8,77],[10,80],[16,82],[21,88],[22,92],[16,97],[8,98],[1,104],[10,108],[21,108],[22,114],[31,122],[39,125],[42,131],[48,140],[59,150],[60,163],[66,170],[66,179],[70,179],[76,142],[77,104]],
      [[45,142],[43,145],[35,140],[33,131],[35,133],[40,140],[45,142]],
      [[-11,142],[-14,136],[-12,131],[-15,124],[-21,115],[-29,114],[-35,117],[-35,138],[-38,145],[-34,151],[-25,153],[-15,145],[-11,142]],
      [[-35,173],[-37,178],[-41,175],[-46,167],[-44,171],[-35,173]],
      [[-68,-60],[-72,-30],[-70,10],[-66,60],[-67,90],[-65,120],[-68,150],[-75,170],[-78,-170],[-75,-120],[-70,-90],[-68,-60]]
    ];

    const GLOBAL_CITIES = [
      { name: 'Tokyo', lat: 35.68, lon: 139.76 },
      { name: 'New York', lat: 40.71, lon: -74.01 },
      { name: 'London', lat: 51.51, lon: -0.13 },
      { name: 'Singapore', lat: 1.35, lon: 103.82 },
      { name: 'Sydney', lat: -33.87, lon: 151.21 },
      { name: 'Cairo', lat: 30.04, lon: 31.24 },
      { name: 'São Paulo', lat: -23.55, lon: -46.63 },
      { name: 'Manila', lat: 14.60, lon: 120.98 },
      { name: 'Paris', lat: 48.86, lon: 2.35 },
      { name: 'Mumbai', lat: 19.08, lon: 72.88 },
      { name: 'San Francisco', lat: 37.77, lon: -122.42 },
      { name: 'Johannesburg', lat: -26.20, lon: 28.04 }
    ];

    function createContinentsTexture() {
      const width = 2048;
      const height = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#01050d');
      grad.addColorStop(0.5, '#020b18');
      grad.addColorStop(1, '#01050d');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      const lonToX = (lon) => ((lon + 180) / 360) * width;
      const latToY = (lat) => ((90 - lat) / 180) * height;

      ctx.strokeStyle = 'rgba(0, 160, 255, 0.12)';
      ctx.lineWidth = 1;
      for (let lon = -180; lon <= 180; lon += 30) {
        const x = lonToX(lon);
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }

      for (let lat = -75; lat <= 75; lat += 15) {
        const y = latToY(lat);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(0, 245, 255, 0.45)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(0, height / 2);
      ctx.lineTo(width, height / 2);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.strokeStyle = 'rgba(0, 210, 255, 0.25)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(0, latToY(23.5));
      ctx.lineTo(width, latToY(23.5));
      ctx.moveTo(0, latToY(-23.5));
      ctx.lineTo(width, latToY(-23.5));
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.shadowColor = '#00f5ff';
      ctx.shadowBlur = 16;
      ctx.fillStyle = 'rgba(3, 26, 52, 0.9)';
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 3.5;

      CONTINENT_POLYGONS.forEach((poly) => {
        if (poly.length < 3) return;
        ctx.beginPath();
        ctx.moveTo(lonToX(poly[0][1]), latToY(poly[0][0]));
        for (let i = 1; i < poly.length; i++) {
          ctx.lineTo(lonToX(poly[i][1]), latToY(poly[i][0]));
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      });

      ctx.shadowBlur = 6;
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      CONTINENT_POLYGONS.forEach((poly) => {
        if (poly.length < 3) return;
        ctx.beginPath();
        ctx.moveTo(lonToX(poly[0][1]), latToY(poly[0][0]));
        for (let i = 1; i < poly.length; i++) {
          ctx.lineTo(lonToX(poly[i][1]), latToY(poly[i][0]));
        }
        ctx.closePath();
        ctx.stroke();
      });
      ctx.shadowBlur = 0;

      function isInsideContinents(x, y) {
        for (const poly of CONTINENT_POLYGONS) {
          let inside = false;
          for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = lonToX(poly[i][1]);
            const yi = latToY(poly[i][0]);
            const xj = lonToX(poly[j][1]);
            const yj = latToY(poly[j][0]);
            const intersect = yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi;
            if (intersect) inside = !inside;
          }
          if (inside) return true;
        }
        return false;
      }

      for (let y = 16; y < height; y += 16) {
        for (let x = 16; x < width; x += 16) {
          if (isInsideContinents(x, y)) {
            ctx.fillStyle = 'rgba(0, 245, 255, 0.75)';
            ctx.beginPath();
            ctx.arc(x, y, 1.8, 0, Math.PI * 2);
            ctx.fill();
          } else if (Math.random() < 0.04) {
            ctx.fillStyle = 'rgba(0, 150, 255, 0.2)';
            ctx.beginPath();
            ctx.arc(x, y, 1.0, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      GLOBAL_CITIES.forEach((c) => {
        const x = lonToX(c.lon);
        const y = latToY(c.lat);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#00f5ff';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(x, y, 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#00f5ff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(x, y, 8, 0, Math.PI * 2);
        ctx.stroke();

        ctx.font = 'bold 18px monospace';
        ctx.fillStyle = 'rgba(180, 240, 255, 0.85)';
        ctx.shadowBlur = 4;
        ctx.fillText(c.name.toUpperCase(), x + 10, y + 5);
      });

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.generateMipmaps = true;
      return texture;
    }

    function createNetworkArcs(radius) {
      const group = new THREE.Group();
      const connections = [
        [0, 1], [1, 2], [2, 7], [0, 3], [3, 4], [2, 5],
        [1, 6], [6, 11], [7, 0], [10, 1], [9, 3], [8, 2]
      ];

      function latLonToVector3(city) {
        const phi = (city.lat * Math.PI) / 180;
        const theta = (city.lon * Math.PI) / 180;
        return new THREE.Vector3(
          radius * Math.cos(phi) * Math.sin(theta),
          radius * Math.sin(phi),
          radius * Math.cos(phi) * Math.cos(theta)
        );
      }

      connections.forEach(([fromIdx, toIdx]) => {
        const start = latLonToVector3(GLOBAL_CITIES[fromIdx]);
        const end = latLonToVector3(GLOBAL_CITIES[toIdx]);
        const mid = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
        const dist = start.distanceTo(end);
        mid.normalize().multiplyScalar(radius + dist * 0.28);

        const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
        const points = curve.getPoints(36);
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({
          color: 0x00f5ff,
          transparent: true,
          opacity: 0.55,
          blending: THREE.AdditiveBlending
        });
        group.add(new THREE.Line(geometry, material));
      });
      return group;
    }

    function createTopicLabelSprite(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, 1024, 256);
      ctx.fillStyle = 'rgba(2, 10, 22, 0.84)';
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.55)';
      ctx.lineWidth = 4;

      ctx.beginPath();
      ctx.moveTo(46, 20);
      ctx.lineTo(978, 20);
      ctx.lineTo(1004, 46);
      ctx.lineTo(1004, 210);
      ctx.lineTo(978, 236);
      ctx.lineTo(46, 236);
      ctx.lineTo(20, 210);
      ctx.lineTo(20, 46);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = '#00f5ff';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(20, 62);
      ctx.lineTo(20, 46);
      ctx.lineTo(62, 20);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(1004, 194);
      ctx.lineTo(1004, 210);
      ctx.lineTo(962, 236);
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0, 229, 255, 0.6)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#cbf3ff';

      const lines = text.split('\n');
      if (lines.length > 1) {
        ctx.font = '900 46px "Orbitron", "Rajdhani", -apple-system, BlinkMacSystemFont, "Segoe UI", monospace, sans-serif';
        const lineHeight = 56;
        const startY = 128 - ((lines.length - 1) * lineHeight) / 2;
        lines.forEach((line, i) => {
          ctx.fillText(line, 512, startY + i * lineHeight);
        });
      } else {
        ctx.font = '900 58px "Orbitron", "Rajdhani", -apple-system, BlinkMacSystemFont, "Segoe UI", monospace, sans-serif';
        ctx.fillText(text, 512, 128);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;

      const spriteMat = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthTest: false,
        depthWrite: false
      });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(20, 5, 1);
      sprite.position.set(0, 5.4, 0);
      return sprite;
    }

    // Initialize 3D Scene
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020408, 0.0055);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1200);
    camera.position.set(0, 20, 105);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;

    const canvas = renderer.domElement;
    canvas.style.display = 'block';
    canvas.style.position = 'absolute';
    canvas.style.top = '0';
    canvas.style.left = '0';
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    canvas.style.cursor = 'grab';
    container.appendChild(canvas);

    scene.add(new THREE.AmbientLight(0x0b2545, 2.0));
    scene.add(new THREE.PointLight(0x00f5ff, 4.5, 250, 1.2));

    const dirLight1 = new THREE.DirectionalLight(0x93c5fd, 1.8);
    dirLight1.position.set(40, 70, 50);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x0284c7, 1.4);
    dirLight2.position.set(-40, -60, -40);
    scene.add(dirLight2);

    const sceneGroup = new THREE.Group();
    scene.add(sceneGroup);

    const globeAxisGroup = new THREE.Group();
    globeAxisGroup.rotation.z = (23.4 * Math.PI) / 180;
    sceneGroup.add(globeAxisGroup);

    const globeRadius = 15;
    const continentsTex = createContinentsTexture();
    const globeMesh = new THREE.Mesh(
      new THREE.SphereGeometry(globeRadius, 64, 48),
      new THREE.MeshStandardMaterial({
        map: continentsTex,
        roughness: 0.25,
        metalness: 0.55,
        emissive: 0x002244,
        emissiveIntensity: 1.1
      })
    );
    globeAxisGroup.add(globeMesh);

    const atmosphereMesh = new THREE.Mesh(
      new THREE.SphereGeometry(globeRadius * 1.04, 48, 32),
      new THREE.MeshBasicMaterial({
        color: 0x00f5ff,
        transparent: true,
        opacity: 0.18,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending
      })
    );
    globeAxisGroup.add(atmosphereMesh);

    const cyberGridMesh = new THREE.Mesh(
      new THREE.SphereGeometry(globeRadius * 1.08, 32, 16),
      new THREE.MeshBasicMaterial({
        color: 0x00e5ff,
        wireframe: true,
        transparent: true,
        opacity: 0.12
      })
    );
    globeAxisGroup.add(cyberGridMesh);

    globeAxisGroup.add(createNetworkArcs(globeRadius));

    const orbitalRings = [];
    [
      { radius: 18.5, tube: 0.13, color: 0x00f5ff, rotX: 1.25, rotY: 0.3, speed: 0.005 },
      { radius: 23.0, tube: 0.10, color: 0x38bdf8, rotX: 0.45, rotY: 1.1, speed: -0.0035 },
      { radius: 28.0, tube: 0.08, color: 0x0284c7, rotX: -0.85, rotY: 0.5, speed: 0.0025 }
    ].forEach((cfg) => {
      const ringMesh = new THREE.Mesh(
        new THREE.TorusGeometry(cfg.radius, cfg.tube, 16, 96),
        new THREE.MeshBasicMaterial({ color: cfg.color, transparent: true, opacity: 0.65 })
      );
      ringMesh.rotation.x = cfg.rotX;
      ringMesh.rotation.y = cfg.rotY;
      globeAxisGroup.add(ringMesh);
      orbitalRings.push({ mesh: ringMesh, speed: cfg.speed });
    });

    // Space star dust
    const starGeom = new THREE.BufferGeometry();
    const starPos = new Float32Array(1200 * 3);
    const starCols = new Float32Array(1200 * 3);
    for (let i = 0; i < 1200; i++) {
      const r = 32 + Math.random() * 110;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(Math.random() * 2 - 1);
      starPos[i * 3 + 0] = r * Math.sin(ph) * Math.cos(th);
      starPos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th) * 0.6;
      starPos[i * 3 + 2] = r * Math.cos(ph);
      starCols[i * 3 + 0] = 0.0;
      starCols[i * 3 + 1] = 0.7 + Math.random() * 0.3;
      starCols[i * 3 + 2] = 1.0;
    }
    starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    starGeom.setAttribute('color', new THREE.BufferAttribute(starCols, 3));
    const starParticles = new THREE.Points(
      starGeom,
      new THREE.PointsMaterial({ size: 0.85, vertexColors: true, transparent: true, opacity: 0.65, blending: THREE.AdditiveBlending })
    );
    scene.add(starParticles);

    // 10 Topic Crystals
    const topicNodes = [];
    TOPICS.forEach((topic, idx) => {
      const angle = (idx / TOPICS.length) * Math.PI * 2;
      const posX = Math.cos(angle) * 46;
      const posY = Math.sin(angle * 2) * 7.5;
      const posZ = Math.sin(angle) * 46;

      const group = new THREE.Group();
      group.position.set(posX, posY, posZ);
      sceneGroup.add(group);

      const diamondMesh = new THREE.Mesh(
        new THREE.OctahedronGeometry(2.9, 0),
        new THREE.MeshStandardMaterial({ color: 0x00f5ff, emissive: 0x004466, metalness: 0.92, roughness: 0.14 })
      );
      group.add(diamondMesh);

      const innerMesh = new THREE.Mesh(
        new THREE.OctahedronGeometry(1.7, 0),
        new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.85 })
      );
      diamondMesh.add(innerMesh);

      const ringMesh = new THREE.Mesh(
        new THREE.TorusGeometry(4.2, 0.08, 12, 48),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.75 })
      );
      ringMesh.rotation.x = Math.PI / 2;
      group.add(ringMesh);

      group.add(new THREE.Mesh(
        new THREE.CylinderGeometry(0.04, 0.04, 20, 8),
        new THREE.MeshBasicMaterial({ color: 0x00f5ff, transparent: true, opacity: 0.35 })
      ));

      group.add(createTopicLabelSprite(topic.name));

      const lineGeom = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(posX, posY, posZ)
      ]);
      const connectorLine = new THREE.Line(
        lineGeom,
        new THREE.LineBasicMaterial({ color: 0x0284c7, transparent: true, opacity: 0.35 })
      );
      sceneGroup.add(connectorLine);

      topicNodes.push({ group, gemMesh: diamondMesh, innerMesh, ringMesh, basePos: new THREE.Vector3(posX, posY, posZ), connectorLine });
    });

    // Swirling diamond dust particles
    const dustMeshes = [];
    const dustGroup = new THREE.Group();
    sceneGroup.add(dustGroup);

    let seed = 42;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    for (let i = 0; i < 42; i++) {
      const r = 24 + rnd() * 38;
      const th = (i / 42) * Math.PI * 2 + rnd() * 0.5;
      const y = (rnd() - 0.5) * 28;
      const spec = {
        size: 0.5 + rnd() * 1.4,
        speed: (0.003 + rnd() * 0.007) * (rnd() > 0.5 ? 1 : -1),
        rotX: 0.01 + rnd() * 0.03,
        rotY: 0.01 + rnd() * 0.03,
        orbitRadius: r,
        angle: th,
        verticalOffset: y
      };
      const mesh = new THREE.Mesh(
        new THREE.OctahedronGeometry(spec.size, 0),
        new THREE.MeshStandardMaterial({ color: 0x00f5ff, emissive: 0x003355, metalness: 0.95, roughness: 0.18 })
      );
      mesh.position.set(Math.cos(th) * r, y, Math.sin(th) * r);
      dustGroup.add(mesh);
      dustMeshes.push({ mesh, spec });
    }

    // Interaction handlers (rotation drag and scroll zoom only)
    let isDragging = false;
    let prevPointer = { x: 0, y: 0 };
    let targetRotX = 0.15;
    let targetRotY = 0;
    let curRotX = 0.15;
    let curRotY = 0;
    let targetDist = 105;
    let curDist = 105;

    window.addEventListener('mousedown', (e) => {
      if (e.target === canvas) {
        isDragging = true;
        canvas.style.cursor = 'grabbing';
        prevPointer = { x: e.clientX, y: e.clientY };
      }
    });
    window.addEventListener('mouseup', () => { isDragging = false; canvas.style.cursor = 'grab'; });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - prevPointer.x;
      const dy = e.clientY - prevPointer.y;
      targetRotY += dx * 0.005;
      targetRotX += dy * 0.005;
      targetRotX = Math.max(-1.15, Math.min(1.15, targetRotX));
      prevPointer = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('wheel', (e) => {
      targetDist += e.deltaY * 0.055;
      targetDist = Math.max(55, Math.min(150, targetDist));
    }, { passive: true });

    let touchStartDist = 0;
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        prevPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        touchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (isDragging && e.touches.length === 1) {
        const dx = e.touches[0].clientX - prevPointer.x;
        const dy = e.touches[0].clientY - prevPointer.y;
        targetRotY += dx * 0.006;
        targetRotX += dy * 0.006;
        targetRotX = Math.max(-1.15, Math.min(1.15, targetRotX));
        prevPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        targetDist += (touchStartDist - d) * 0.1;
        targetDist = Math.max(55, Math.min(150, targetDist));
        touchStartDist = d;
      }
    }, { passive: true });

    window.addEventListener('touchend', () => { isDragging = false; });
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      if (!isDragging) {
        targetRotY += 0.0016;
      }

      curRotX += (targetRotX - curRotX) * 0.06;
      curRotY += (targetRotY - curRotY) * 0.06;
      sceneGroup.rotation.x = curRotX;
      sceneGroup.rotation.y = curRotY;

      curDist += (targetDist - curDist) * 0.06;
      camera.position.z = curDist;

      // Axial spins matching preview
      globeMesh.rotation.y += 0.004;
      atmosphereMesh.rotation.y += 0.003;
      cyberGridMesh.rotation.y -= 0.002;

      starParticles.rotation.y = -elapsedTime * 0.025;
      orbitalRings.forEach(r => { r.mesh.rotation.z += r.speed; });

      dustMeshes.forEach(d => {
        d.spec.angle += d.spec.speed * 0.4;
        d.mesh.position.x = Math.cos(d.spec.angle) * d.spec.orbitRadius;
        d.mesh.position.z = Math.sin(d.spec.angle) * d.spec.orbitRadius;
        d.mesh.position.y = d.spec.verticalOffset + Math.sin(elapsedTime * 1.5 + d.spec.angle) * 1.8;
        d.mesh.rotation.x += d.spec.rotX;
        d.mesh.rotation.y += d.spec.rotY;
      });

      topicNodes.forEach((node, i) => {
        node.gemMesh.rotation.y += 0.025;
        node.gemMesh.rotation.x += 0.012;
        node.innerMesh.rotation.z -= 0.03;
        node.ringMesh.rotation.z += 0.015;

        const wave = Math.sin(elapsedTime * 1.8 + i) * 0.85;
        node.group.position.y = node.basePos.y + wave;

        const pos = node.connectorLine.geometry.attributes.position.array;
        pos[3] = node.group.position.x;
        pos[4] = node.group.position.y;
        pos[5] = node.group.position.z;
        node.connectorLine.geometry.attributes.position.needsUpdate = true;
      });

      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
