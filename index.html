    function createContinentsTexture() {
      const width = 2048;
      const height = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#01050d');
      grad.addColorStop(0.5, '#020b18');
      grad.addColorStop(1, '#01050d');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      const lonToX = (lon) => ((lon + 180) / 360) * width;
      const latToY = (lat) => ((90 - lat) / 180) * height;

      ctx.strokeStyle = 'rgba(0, 160, 255, 0.12)';
      ctx.lineWidth = 1;
      for (let lon = -180; lon <= 180; lon += 30) {
        const x = lonToX(lon);
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }

      for (let lat = -75; lat <= 75; lat += 15) {
        const y = latToY(lat);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(0, 245, 255, 0.45)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(0, height / 2);
      ctx.lineTo(width, height / 2);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.strokeStyle = 'rgba(0, 210, 255, 0.25)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(0, latToY(23.5));
      ctx.lineTo(width, latToY(23.5));
      ctx.moveTo(0, latToY(-23.5));
      ctx.lineTo(width, latToY(-23.5));
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.shadowColor = '#00f5ff';
      ctx.shadowBlur = 16;
      ctx.fillStyle = 'rgba(3, 26, 52, 0.9)';
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 3.5;

      CONTINENT_POLYGONS.forEach((poly) => {
        if (poly.length < 3) return;
        ctx.beginPath();
        ctx.moveTo(lonToX(poly[0][1]), latToY(poly[0][0]));
        for (let i = 1; i < poly.length; i++) {
          ctx.lineTo(lonToX(poly[i][1]), latToY(poly[i][0]));
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      });

      ctx.shadowBlur = 6;
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      CONTINENT_POLYGONS.forEach((poly) => {
        if (poly.length < 3) return;
        ctx.beginPath();
        ctx.moveTo(lonToX(poly[0][1]), latToY(poly[0][0]));
        for (let i = 1; i < poly.length; i++) {
          ctx.lineTo(lonToX(poly[i][1]), latToY(poly[i][0]));
        }
        ctx.closePath();
        ctx.stroke();
      });
      ctx.shadowBlur = 0;

      function isInsideContinents(x, y) {
        for (const poly of CONTINENT_POLYGONS) {
          let inside = false;
          for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = lonToX(poly[i][1]);
            const yi = latToY(poly[i][0]);
            const xj = lonToX(poly[j][1]);
            const yj = latToY(poly[j][0]);
            const intersect = yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi;
            if (intersect) inside = !inside;
          }
          if (inside) return true;
        }
        return false;
      }

      for (let y = 16; y < height; y += 16) {
        for (let x = 16; x < width; x += 16) {
          if (isInsideContinents(x, y)) {
            ctx.fillStyle = 'rgba(0, 245, 255, 0.75)';
            ctx.beginPath();
            ctx.arc(x, y, 1.8, 0, Math.PI * 2);
            ctx.fill();
          } else if (Math.random() < 0.04) {
            ctx.fillStyle = 'rgba(0, 150, 255, 0.2)';
            ctx.beginPath();
            ctx.arc(x, y, 1.0, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      GLOBAL_CITIES.forEach((c) => {
        const x = lonToX(c.lon);
        const y = latToY(c.lat);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#00f5ff';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(x, y, 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#00f5ff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(x, y, 8, 0, Math.PI * 2);
        ctx.stroke();

        ctx.font = 'bold 18px monospace';
        ctx.fillStyle = 'rgba(180, 240, 255, 0.85)';
        ctx.shadowBlur = 4;
        ctx.fillText(c.name.toUpperCase(), x + 10, y + 5);
      });

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.generateMipmaps = true;
      return texture;
    }

    function createNetworkArcs(radius) {
      const group = new THREE.Group();
      const connections = [
        [0, 1], [1, 2], [2, 7], [0, 3], [3, 4], [2, 5],
        [1, 6], [6, 11], [7, 0], [10, 1], [9, 3], [8, 2]
      ];

      function latLonToVector3(city) {
        const phi = (city.lat * Math.PI) / 180;
        const theta = (city.lon * Math.PI) / 180;
        return new THREE.Vector3(
          radius * Math.cos(phi) * Math.sin(theta),
          radius * Math.sin(phi),
          radius * Math.cos(phi) * Math.cos(theta)
        );
      }

      connections.forEach(([fromIdx, toIdx]) => {
        const start = latLonToVector3(GLOBAL_CITIES[fromIdx]);
        const end = latLonToVector3(GLOBAL_CITIES[toIdx]);
        const mid = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
        const dist = start.distanceTo(end);
        mid.normalize().multiplyScalar(radius + dist * 0.28);

        const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
        const points = curve.getPoints(36);
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({
          color: 0x00f5ff,
          transparent: true,
          opacity: 0.55,
          blending: THREE.AdditiveBlending
        });
        group.add(new THREE.Line(geometry, material));
      });
      return group;
    }

    function createTopicLabelSprite(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, 1024, 256);
      ctx.fillStyle = 'rgba(2, 10, 22, 0.84)';
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.55)';
      ctx.lineWidth = 4;

      ctx.beginPath();
      ctx.moveTo(46, 20);
      ctx.lineTo(978, 20);
      ctx.lineTo(1004, 46);
      ctx.lineTo(1004, 210);
      ctx.lineTo(978, 236);
      ctx.lineTo(46, 236);
      ctx.lineTo(20, 210);
      ctx.lineTo(20, 46);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = '#00f5ff';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(20, 62);
      ctx.lineTo(20, 46);
      ctx.lineTo(62, 20);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(1004, 194);
      ctx.lineTo(1004, 210);
      ctx.lineTo(962, 236);
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0, 229, 255, 0.6)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#cbf3ff';

      const lines = text.split('\n');
      if (lines.length > 1) {
        ctx.font = '900 46px "Orbitron", "Rajdhani", -apple-system, BlinkMacSystemFont, "Segoe UI", monospace, sans-serif';
        const lineHeight = 56;
        const startY = 128 - ((lines.length - 1) * lineHeight) / 2;
        lines.forEach((line, i) => {
          ctx.fillText(line, 512, startY + i * lineHeight);
        });
      } else {
        ctx.font = '900 58px "Orbitron", "Rajdhani", -apple-system, BlinkMacSystemFont, "Segoe UI", monospace, sans-serif';
        ctx.fillText(text, 512, 128);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;

      const spriteMat = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthTest: false,
        depthWrite: false
      });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(20, 5, 1);
      sprite.position.set(0, 5.4, 0);
      return sprite;
    }

    // ==============================================================

    const chassisMat = new THREE.MeshStandardMaterial({

    const edgeLineMat = new THREE.LineBasicMaterial({

    function addContourEdges(mesh, parentGroup) {
      const edges = new THREE.EdgesGeometry(mesh.geometry);
      const line = new THREE.LineSegments(edges, edgeLineMat);
      line.position.copy(mesh.position);
      line.rotation.copy(mesh.rotation);
      line.scale.copy(mesh.scale);
      parentGroup.add(line);
    }

    function createTablet() {
      const group = new THREE.Group();

      const body = new THREE.Mesh(new THREE.BoxGeometry(2.8, 4.0, 0.14), chassisMat);

      addContourEdges(body, group);

      const camDot = new THREE.Mesh(new THREE.CircleGeometry(0.06, 16), darkAccentMat);

      const stylus = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 3.4, 12), chassisMat);
      stylus.position.set(1.75, 0, 0);
      stylus.rotation.z = -0.15;
      group.add(stylus);

      const stylusTip = new THREE.Mesh(new THREE.ConeGeometry(0.065, 0.25, 12), whiteScreenMat);
      stylusTip.position.set(1.75 + Math.sin(0.15) * 1.7, 1.7 * Math.cos(0.15) + 0.12, 0);
      stylusTip.rotation.z = -0.15;
      group.add(stylusTip);

      };
      const mesh = new THREE.Mesh(
        new THREE.OctahedronGeometry(spec.size, 0),
        new THREE.MeshStandardMaterial({ color: 0x00f5ff, emissive: 0x003355, metalness: 0.95, roughness: 0.18 })
      );
      mesh.position.set(Math.cos(th) * r, y, Math.sin(th) * r);
      dustGroup.add(mesh);
      dustMeshes.push({ mesh, spec });
    }

    // Interaction handlers (rotation drag, scroll zoom, and topic clicking)
    let isDragging = false;
    let prevPointer = { x: 0, y: 0 };
    let pointerDownPos = { x: 0, y: 0 };
    let pointerDownTime = 0;
    let targetRotX = 0.15;
    let targetRotY = 0;
    let curRotX = 0.15;
    let curRotY = 0;
    let targetDist = 125;
    let curDist = 125;

    // Raycasting & click interactions
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let hoveredNode = null;

    function getIntersectedTopic(clientX, clientY) {
      pointer.x = (clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObjects(clickableObjects, false);
      if (intersects.length > 0) {
        return intersects[0].object.userData.topicNode || null;
      }
      return null;
    }

    function updateHover(clientX, clientY) {
      const node = getIntersectedTopic(clientX, clientY);
      if (hoveredNode !== node) {
        if (hoveredNode) hoveredNode.isHovered = false;
        hoveredNode = node;
        if (hoveredNode) hoveredNode.isHovered = true;
      }
      if (!isDragging) {
        canvas.style.cursor = hoveredNode ? 'pointer' : 'grab';
      }
    }

    let audioCtx = null;
    function playHoloSound() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioCtx) {
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        const now = audioCtx.currentTime;
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.22);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } catch (err) {}
    }

    function triggerTopicClick(node) {
      node.animating = true;
      node.animProgress = 0;
      playHoloSound();

      if (node.isBlog) {
        setTimeout(() => {
          try {
            if (window.top && window.top !== window) {
              window.top.location.href = 'https://steve595-iis.github.io/Effective-communication-group2-blog/';
            } else {
              window.location.href = 'https://steve595-iis.github.io/Effective-communication-group2-blog/';
            }
          } catch (e) {
            window.location.href = 'https://steve595-iis.github.io/Effective-communication-group2-blog/';
          }
        }, 280);
      } else if (node.isInfographics) {
        setTimeout(() => {
          try {
            if (window.top && window.top !== window) {
              window.top.location.href = 'https://steve595-iis.github.io/Effective-communication-group2-infographics/';
            } else {
              window.location.href = 'https://steve595-iis.github.io/Effective-communication-group2-infographics/';
            }
          } catch (e) {
            window.location.href = 'https://steve595-iis.github.io/Effective-communication-group2-infographics/';
          }
        }, 280);
      }
    }

    window.addEventListener('mousedown', (e) => {
      if (e.target === canvas) {
        isDragging = true;
        pointerDownPos = { x: e.clientX, y: e.clientY };
        pointerDownTime = performance.now();
        canvas.style.cursor = 'grabbing';
        prevPointer = { x: e.clientX, y: e.clientY };
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (isDragging) {
        isDragging = false;
        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        const elapsed = performance.now() - pointerDownTime;
        if (dist < 6 && elapsed < 400 && e.target === canvas) {
          const clickedNode = getIntersectedTopic(e.clientX, e.clientY);
          if (clickedNode) {
            triggerTopicClick(clickedNode);
          }
        }
      }
      updateHover(e.clientX, e.clientY);
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) {
        updateHover(e.clientX, e.clientY);
        return;
      }
      const dx = e.clientX - prevPointer.x;
      const dy = e.clientY - prevPointer.y;
      targetRotY += dx * 0.005;
      targetRotX += dy * 0.005;
      targetRotX = Math.max(-1.15, Math.min(1.15, targetRotX));
      prevPointer = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('wheel', (e) => {
      targetDist += e.deltaY * 0.065;
      targetDist = Math.max(50, Math.min(220, targetDist));
    }, { passive: true });

    let touchStartDist = 0;
    let touchStartPos = { x: 0, y: 0 };
    let touchStartTime = 0;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        touchStartTime = performance.now();
        prevPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        touchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (isDragging && e.touches.length === 1) {
        const dx = e.touches[0].clientX - prevPointer.x;
        const dy = e.touches[0].clientY - prevPointer.y;
        targetRotY += dx * 0.006;
        targetRotX += dy * 0.006;
        targetRotX = Math.max(-1.15, Math.min(1.15, targetRotX));
        prevPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        targetDist += (touchStartDist - d) * 0.12;
        targetDist = Math.max(50, Math.min(220, targetDist));
        touchStartDist = d;
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (isDragging && e.changedTouches.length === 1) {
        const t = e.changedTouches[0];
        const dist = Math.hypot(t.clientX - touchStartPos.x, t.clientY - touchStartPos.y);
        const elapsed = performance.now() - touchStartTime;
        if (dist < 10 && elapsed < 450) {
          const clickedNode = getIntersectedTopic(t.clientX, t.clientY);
          if (clickedNode) {
            triggerTopicClick(clickedNode);
          }
        }
      }
      isDragging = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      if (!isDragging) {
        targetRotY += 0.0016;
      }

      curRotX += (targetRotX - curRotX) * 0.06;
      curRotY += (targetRotY - curRotY) * 0.06;
      sceneGroup.rotation.x = curRotX;
      sceneGroup.rotation.y = curRotY;

      curDist += (targetDist - curDist) * 0.06;
      camera.position.z = curDist;

      // Axial globe spins
      globeMesh.rotation.y += 0.004;
      atmosphereMesh.rotation.y += 0.003;
      cyberGridMesh.rotation.y -= 0.002;

      starParticles.rotation.y = -elapsedTime * 0.02;
      orbitalRings.forEach(r => { r.mesh.rotation.z += r.speed; });

      dustMeshes.forEach(d => {
        d.spec.angle += d.spec.speed * 0.4;
        d.mesh.position.x = Math.cos(d.spec.angle) * d.spec.orbitRadius;
        d.mesh.position.z = Math.sin(d.spec.angle) * d.spec.orbitRadius;
        d.mesh.position.y = d.spec.verticalOffset + Math.sin(elapsedTime * 1.5 + d.spec.angle) * 1.8;
        d.mesh.rotation.x += d.spec.rotX;
        d.mesh.rotation.y += d.spec.rotY;
      });

      // Animate topic nodes
      topicNodes.forEach((node, i) => {
        node.gemMesh.rotation.y += 0.025;
        node.gemMesh.rotation.x += 0.012;
        node.innerMesh.rotation.z -= 0.03;
        node.ringMesh.rotation.z += 0.015;

        if (node.animating) {
          node.animProgress += 0.035;
          const p = node.animProgress;
          if (p >= 1.0) {
            node.animating = false;
            node.animProgress = 0;
            node.gemMesh.scale.set(1, 1, 1);
            node.labelSprite.scale.set(20, 5, 1);
            node.gemMesh.material.emissive.setHex(0x004466);
            node.gemMesh.material.emissiveIntensity = 1.1;
            node.shockwave.material.opacity = 0;
            node.shockwave.scale.set(1, 1, 1);
          } else {
            let scaleVal = 1.0;
            if (p < 0.2) {
              scaleVal = 1.0 - (p / 0.2) * 0.22;
            } else if (p < 0.5) {
              const t = (p - 0.2) / 0.3;
              scaleVal = 0.78 + t * 0.62;
            } else {
              const t = (p - 0.5) / 0.5;
              scaleVal = 1.40 - Math.sin(t * Math.PI * 0.5) * 0.40;
            }

            node.gemMesh.scale.setScalar(scaleVal);
            node.labelSprite.scale.set(20 * scaleVal, 5 * scaleVal, 1);

            const flash = Math.max(0, 1.0 - p) * 3.2 + 1.1;
            node.gemMesh.material.emissiveIntensity = flash;
            if (p < 0.35) {
              node.gemMesh.material.emissive.setHex(0xffffff);
            } else {
              node.gemMesh.material.emissive.setHex(0x00f5ff);
            }

            const shockScale = 1.0 + p * 3.8;
            node.shockwave.scale.set(shockScale, shockScale, 1);
            node.shockwave.material.opacity = Math.max(0, (1.0 - p) * 0.85);

            node.ringMesh.rotation.z += 0.22;
          }
        } else if (node.isHovered) {
          node.gemMesh.scale.lerp(new THREE.Vector3(1.12, 1.12, 1.12), 0.15);
          node.labelSprite.scale.lerp(new THREE.Vector3(22.4, 5.6, 1), 0.15);
          node.gemMesh.material.emissiveIntensity = 1.8;
        } else {
          node.gemMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
          node.labelSprite.scale.lerp(new THREE.Vector3(20, 5, 1), 0.1);
          node.gemMesh.material.emissive.setHex(0x004466);
          node.gemMesh.material.emissiveIntensity = 1.1;
        }

        const wave = Math.sin(elapsedTime * 1.8 + i) * 0.85;
        node.group.position.y = node.basePos.y + wave;

        const pos = node.connectorLine.geometry.attributes.position.array;
        pos[3] = node.group.position.x;
        pos[4] = node.group.position.y;
        pos[5] = node.group.position.z;
        node.connectorLine.geometry.attributes.position.needsUpdate = true;
      });

      // Animate floating devices
      floatingDevices.forEach((dev) => {
        dev.angle += dev.orbitSpeed;
        dev.holder.position.x = Math.cos(dev.angle) * dev.orbitRadius;
        dev.holder.position.z = Math.sin(dev.angle) * dev.orbitRadius;
        dev.holder.position.y = dev.baseY + Math.sin(elapsedTime * dev.bobSpeed + dev.phase) * 1.8;

        dev.model.rotation.x += dev.rotX;
        dev.model.rotation.y += dev.rotY;
        dev.model.rotation.z += dev.rotZ;
      });

      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
